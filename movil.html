  .center{ background:var(--bg) var(--bg-pattern); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .box{ width:100%; max-width:380px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:24px; }
  .box h1{ margin:0 0 4px; font-size:20px; }
  .box img.logo + h1{ text-align:center; margin-bottom:18px; }
  .box img.logo + h1 + p{ text-align:center; margin-top:-8px; }
  .box p{ margin:0 0 16px; color:var(--muted); font-size:13px; }
  .box img.logo{ width:84px; height:84px; border-radius:18px; display:block; margin:0 auto 12px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .field input{ width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:16px; }
  .btn{ width:100%; padding:13px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:700; font-size:15px; cursor:pointer; }
  .btn.sec{ background:var(--panel2); color:var(--text); border:1px solid var(--border); font-weight:600; }
  .err{ color:var(--red); font-size:13px; margin:0 0 10px; }
  .proy{ display:flex; align-items:center; gap:12px; width:100%; padding:12px; margin-bottom:8px; border:1px solid var(--border); border-radius:12px; background:var(--panel2); cursor:pointer; text-align:left; font-weight:600; }
  .proy img{ width:36px; height:36px; border-radius:8px; object-fit:cover; }

  /* App */
  header.top{ position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; background:var(--bg); border-bottom:1px solid var(--border); }
  header.top .name{ flex:1; font-weight:800; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .iconbtn{ border:1px solid var(--border); background:var(--panel); border-radius:10px; padding:8px 10px; font-size:14px; cursor:pointer; }
  .bar{ display:flex; gap:8px; padding:10px 14px 0; }
  .bar select{ flex:1; padding:11px 12px; border-radius:10px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:15px; font-weight:600; }
  main{ padding:12px 14px 28px; display:flex; flex-direction:column; gap:12px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .card h2{ margin:0 0 10px; font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
  .kpis{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kpi{ background:var(--panel2); border-radius:12px; padding:12px; }
  .kpi.wide{ grid-column:1 / -1; }
  .kpi .l{ font-size:12px; color:var(--muted); }
  .kpi .n{ font-size:21px; font-weight:800; margin-top:2px; word-break:break-word; }
  .kpi .d{ font-size:12px; margin-top:2px; color:var(--muted); }
  .pos{ color:var(--green); } .neg{ color:var(--red); }
  .chartbox{ position:relative; height:220px; }
  .chartbox.tall{ height:250px; }
  .legend{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .legend .row{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .legend .dot{ width:10px; height:10px; border-radius:3px; flex:none; }
  .legend .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legend .vl{ font-weight:700; }
  .legend .pc{ color:var(--muted); width:46px; text-align:right; }
  .list .item{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .list .item:last-child{ border-bottom:0; }
  .list .when{ width:58px; flex:none; font-weight:700; font-size:13px; }
  .list .who{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list .amt{ font-weight:700; }
  .badge{ font-size:11px; padding:2px 7px; border-radius:20px; background:var(--panel2); color:var(--muted); }
  .badge.late{ background:rgba(217,48,37,.14); color:var(--red); }
  .tbl{ width:100%; border-collapse:collapse; font-size:14px; }
  .tbl td{ padding:8px 0; border-bottom:1px solid var(--border); }
  .tbl tr:last-child td{ border-bottom:0; }
  .tbl td.r{ text-align:right; font-variant-numeric:tabular-nums; }
  .tbl td.p{ text-align:right; color:var(--muted); width:58px; font-size:12px; }
  .tbl tr.b td{ font-weight:800; }
  .empty{ color:var(--muted); font-size:13px; padding:6px 0; }
  .foot{ text-align:center; color:var(--muted); font-size:11px; padding:6px 0 0; }
  .loading{ text-align:center; color:var(--muted); padding:40px 0; }

  /* ===== Navegación (inicio + secciones) ===== */
  #stickyTop{ position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--border); }
  #stickyTop header.top{ position:static; border-bottom:0; }
  header.top .name{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  header.top .name .nm1{ font-weight:800; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header.top .name .nm2{ font-weight:500; font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tabs{ display:flex; gap:8px; overflow-x:auto; padding:2px 14px 10px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex:none; padding:8px 15px; border-radius:20px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:inherit; }
  .tab.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .home{ padding:18px 14px 8px; display:flex; flex-direction:column; gap:14px; max-width:720px; margin:0 auto; }
  .home .hi{ font-size:13px; color:var(--muted); margin:0 2px; }
  .tile{ display:flex; align-items:center; gap:16px; width:100%; padding:20px 18px; border-radius:18px; background:var(--panel); border:1px solid var(--border); color:var(--text); text-align:left; cursor:pointer; font-family:inherit; }
  .tile:active{ transform:scale(.98); }
  .tile .ico{ flex:none; width:62px; height:62px; border-radius:18px; display:flex; align-items:center; justify-content:center; background:rgba(47,110,224,.13); color:var(--accent); }
  .tile .ico svg{ width:32px; height:32px; }
  .tile .t{ font-size:19px; font-weight:800; }
  .tile .s{ font-size:13px; color:var(--muted); margin-top:3px; }
  .tile .chev{ margin-left:auto; color:var(--muted); font-size:24px; }
  main{ max-width:720px; width:100%; margin:0 auto; box-sizing:border-box; }

  /* ===== Filtros ===== */
  .filt{ display:flex; flex-wrap:wrap; gap:10px; }
  .filt .f{ flex:1 1 140px; min-width:0; }
  .filt label{ display:block; font-size:11px; color:var(--muted); margin-bottom:3px; font-weight:600; }
  .filt select,.filt input{ width:100%; box-sizing:border-box; padding:11px 12px; border-radius:10px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px; font-family:inherit; min-height:44px; }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .chip{ padding:7px 12px; border-radius:16px; border:1px solid var(--border); background:var(--panel2); font-size:12.5px; font-weight:600; color:var(--text); cursor:pointer; font-family:inherit; }
  .seg{ display:flex; background:var(--panel2); border-radius:11px; padding:3px; gap:3px; }
  .seg button{ flex:1; padding:9px; border:0; border-radius:9px; background:transparent; color:var(--muted); font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit; }
  .seg button.on{ background:var(--panel); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.18); }

  /* ===== Listas ===== */
  .row2{ display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .row2:last-child{ border-bottom:0; }
  .row2 .dt{ width:46px; flex:none; font-weight:700; font-size:13px; padding-top:1px; }
  .row2 .main{ flex:1; min-width:0; }
  .row2 .ttl{ font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; }
  .row2 .sub{ font-size:12px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; }
  .row2 .val{ font-weight:800; font-size:15px; text-align:right; white-space:nowrap; }
  .row2 .val .pill{ display:block; margin-top:4px; }
  .pill{ display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; background:rgba(31,157,85,.15); color:var(--green); }
  .pill.pend{ background:rgba(192,90,26,.16); color:var(--orange); }
  .pill.late{ background:rgba(217,48,37,.15); color:var(--red); }
  .pill.gray{ background:var(--panel2); color:var(--muted); }
  details.dia{ border-bottom:1px solid var(--border); }
  details.dia:last-child{ border-bottom:0; }
  details.dia summary{ list-style:none; display:flex; align-items:center; gap:10px; padding:13px 0; cursor:pointer; }
  details.dia summary::-webkit-details-marker{ display:none; }
  details.dia .chev{ color:var(--muted); transition:transform .15s; font-size:18px; }
  details.dia[open] .chev{ transform:rotate(90deg); }
  details.dia .main{ flex:1; }
  .det{ background:var(--panel2); border-radius:10px; padding:8px 12px; margin:0 0 12px; font-size:13px; }
  .det .l{ display:flex; justify-content:space-between; gap:10px; padding:4px 0; }
  .det .l.h{ font-weight:700; margin-top:6px; }
  .det .l.h:first-child{ margin-top:0; }
  .det .l.s{ color:var(--muted); padding-left:10px; font-size:12.5px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .novcell{ background:var(--panel2); border-radius:10px; padding:9px 11px; }
  .novcell .l{ font-size:11px; color:var(--muted); }
  .novcell .n{ font-weight:800; font-size:16px; margin-top:1px; }
  .novcell.lleno{ background:#ffe4ea; }
  .novcell.lleno .l{ color:#7a4452; }
  .novcell.lleno .n{ color:#1a1d24; }
  .emp{ padding:13px 0; border-bottom:1px solid var(--border); }
  .emp:last-child{ border-bottom:0; }
  .emp .nm{ font-weight:800; font-size:15px; margin-bottom:8px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .kv{ display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:13.5px; }
  .kv .k{ color:var(--muted); } .kv .v{ font-weight:600; text-align:right; }
  .kv.big{ font-size:15px; border-top:1px dashed var(--border); margin-top:4px; padding-top:8px; } .kv.big .k{ color:var(--text); font-weight:700; } .kv.big .v{ font-weight:800; }
  .hscroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -14px; padding:0 14px; }
  .ht{ border-collapse:separate; border-spacing:0; font-size:13px; white-space:nowrap; }
  .ht th,.ht td{ padding:9px 10px; border-bottom:1px solid var(--border); text-align:right; }
  .ht th:first-child,.ht td:first-child{ position:sticky; left:0; background:var(--panel); text-align:left; font-weight:700; z-index:1; border-right:1px solid var(--border); }
  .ht thead th{ color:var(--muted); font-size:12px; font-weight:700; }
  .ht tfoot td{ font-weight:800; }
  .bars .b{ margin:9px 0; }
  .bars .bt{ display:flex; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:4px; }
  .bars .bt span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .bars .bt span:last-child{ font-weight:700; white-space:nowrap; }
  .bars .bar2{ height:7px; border-radius:5px; background:var(--panel2); overflow:hidden; } .bars .bar2 i{ display:block; height:100%; background:var(--accent); border-radius:5px; }
  .er{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
  .er .p{ color:var(--muted); font-size:12px; width:52px; text-align:right; flex:none; }
  .er .nm{ flex:1; min-width:0; }
  .er .vl{ font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .er.tot{ font-weight:800; background:var(--panel2); margin:0 -8px; padding:9px 8px; border-radius:8px; border-bottom:0; }
  .er.h1{ font-weight:800; }
  .er.h2{ font-weight:700; }
  .more{ width:100%; margin-top:10px; }
  .sechead{ font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:14px 0 4px; display:flex; justify-content:space-between; }
  .sechead:first-child{ margin-top:0; }
</style>
</head>
<body>

<div id="loginScreen" class="center hidden">
  <div class="box">
    <img class="logo" src="icon-192.png" alt="Brocoli PMS">
    <h1>Brocoli PMS</h1>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" inputmode="email"></div>
    <div class="field"><label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <div id="loginError" class="err hidden"></div>
    <button class="btn" id="btnLogin">Ingresar</button>
  </div>
</div>

<div id="lockScreen" class="center hidden">
  <div class="box">
    <img class="logo" src="icon-192.png" alt="Brocoli PMS">
    <h1>Brocoli PMS</h1>
    <p>Desbloqueá con tu huella o Face ID</p>
    <div id="lockError" class="err hidden"></div>
    <button class="btn" id="btnUnlock">Desbloquear</button>
    <button class="btn sec" id="btnLockPass" style="margin-top:10px">Usar contraseña</button>
  </div>
</div>

<div id="bioOffer" class="center hidden">
  <div class="box">
    <img class="logo" src="icon-192.png" alt="Brocoli PMS">
    <h1>¿Activar huella / Face ID?</h1>
    <p>La próxima vez entrás con tu huella o tu cara, sin escribir la contraseña.</p>
    <div id="bioOfferMsg" class="err hidden"></div>
    <button class="btn" id="btnBioSi">Activar ahora</button>
    <button class="btn sec" id="btnBioNo" style="margin-top:10px">Ahora no</button>
  </div>
</div>

<div id="pickerScreen" class="center hidden">
  <div class="box">

function eerrVentasPorMes(){
  const map = {};
  data.ventasDiarias.forEach(v=>{
    const k = monthKey(v.fecha); if(!k) return;
    if(!map[k]) map[k] = {ventas:0, viandas:0, terceros:0};
    const restTotal = v.restauranteEfectivo + v.restauranteBco + v.restauranteMp;
    const kioscoTotal = v.kioscoEfectivo + v.kioscoBco + v.kioscoMp;
    const chiringoTotal = (v.chiringoEfectivo||0) + (v.chiringoMp||0);
    const parrillaTotal = v.parrillaEfectivo + v.parrillaMp;
    map[k].ventas += restTotal + kioscoTotal + chiringoTotal + parrillaTotal;
    map[k].viandas += v.viandasTotal;
    map[k].terceros += v.terceirosTotal;
  });
  return map;
}

function eerrGastosPorMes(){
  const map = {};
  data.gastos.forEach(g=>{
    const k = monthKey(g.fechaFc || g.fechaCarga); if(!k) return;
    if(!map[k]) map[k] = {};
    /* Normalizado a mayúsculas para que el gasto sume en su línea de EERR sin importar
       cómo haya quedado tipeada la familia (ej: "Bonos" vs "BONOS"). */
    const fam = (g.familiaNombre || '(sin familia)').trim().toUpperCase();
    map[k][fam] = (map[k][fam]||0) + g.total;
  });
  /* Impuestos MP / Impuestos Bco.: casillas cargadas a mano día a día en Ventas y
     Caja. No suman al Total día de esa tabla, pero sí viajan diariamente a estas
     líneas del EERR. */
  data.ventasDiarias.forEach(v=>{
    const k = monthKey(v.fecha); if(!k) return;
    if(!map[k]) map[k] = {};
    if(v.impuestosMp) map[k]['IMPUESTOS Y COMISIONES MP'] = (map[k]['IMPUESTOS Y COMISIONES MP']||0) + v.impuestosMp;
    if(v.impuestosBco) map[k]['COMISION POSNET'] = (map[k]['COMISION POSNET']||0) + v.impuestosBco;
  });
  return map;
}

/* Calcula, para un mes dado, el valor de cada línea de EERR_STRUCTURE usando una pila
   que acumula automáticamente el valor de las líneas de detalle en todos sus headers
   (h1/h2/h3) abiertos — así los subtotales siempre están bien sumados. */
function calcularEerrMes(ventasMes, famMap){
  const rowVals = new Array(EERR_STRUCTURE.length).fill(null);
  const named = {};
  let stack = [];

  function popTo(level){
    while(stack.length && stack[stack.length-1].level >= level){
      const e = stack.pop();
      rowVals[e.idx] = e.sum;
      if(e.key) named[e.key] = e.sum;
      if(stack.length) stack[stack.length-1].sum += e.sum;
    }
  }

  // Pasada 1: recorre solo las líneas de la jerarquía de costos/gastos (headers h1/h2/h3
  // y líneas de detalle) para calcular costosVariables, costosFijos, gastosFinancieros
  // e impuestos. Se ignoran acá las líneas de resumen (ingresos/egresos/resultado) porque
  // dependen de estos totales y todavía no están calculados.
  EERR_STRUCTURE.forEach((row, i)=>{
    if(row.t==='h1' || row.t==='h2' || row.t==='h3'){
      const level = row.t==='h1'?1:row.t==='h2'?2:3;
      popTo(level);
      stack.push({level, idx:i, key:row.key, sum:0});
    } else if(row.t==='d'){
      const val = (famMap && famMap[row.label.trim().toUpperCase()]) || 0;
      rowVals[i] = val;
      if(stack.length) stack[stack.length-1].sum += val;
    }
  });
  popTo(0);

  // Pasada 2: con costosVariables/costosFijos/gastosFinancieros/impuestos ya resueltos,
  // se calculan en orden las líneas de ventas, ingresos, egresos y resultados.
  EERR_STRUCTURE.forEach((row, i)=>{
    if(row.t==='plain'){
      const val = (ventasMes && ventasMes[row.key]) || 0;
      rowVals[i] = val; named[row.key] = val;
    } else if(row.t==='ingresos'){
      const val = (named.ventas||0) + (named.viandas||0) + (named.terceros||0);
      rowVals[i] = val; named.totalIngresos = val; named[row.key] = val;
    } else if(row.t==='egresos'){
      const val = (named.costosVariables||0) + (named.costosFijos||0) + (named.gastosFinancieros||0) + (named.impuestos||0);
      rowVals[i] = val; named[row.key] = val;
    } else if(row.t==='resultado'){
      let val = 0;
      if(row.key==='margenBruto') val = (named.totalIngresos||0) - (named.costosVariables||0);
      else if(row.key==='resultadoOperativo') val = (named.margenBruto||0) - (named.costosFijos||0);
      else if(row.key==='resultadoAntesImpuestos') val = (named.resultadoOperativo||0) - (named.gastosFinancieros||0);
      else if(row.key==='resultadoNeto1') val = (named.totalIngresos||0) - (named.totalEgresos1||0);
      else if(row.key==='resultadoNeto2') val = (named.totalIngresos||0) - (named.totalEgresos2||0);
      rowVals[i] = val; named[row.key] = val;
    }
  });

  return rowVals;
}





function eerrNamed(rowVals){
  const o={};
  EERR_STRUCTURE.forEach((r,i)=>{ if(r.key) o[r.key]=rowVals[i]||0; });
  return o;
}

/* ===== Cálculos (Administración) ===== */
function totalDia(v){
  return v.total + v.kioscoEfectivo+v.kioscoBco+v.kioscoMp + v.chiringoEfectivo+v.chiringoMp + v.viandasTotal + v.terceirosTotal + v.parrillaEfectivo+v.parrillaMp;
}
function mesesEerr(){
  const vm = eerrVentasPorMes(), gm = eerrGastosPorMes();
  return [...new Set([...Object.keys(vm),...Object.keys(gm)])].sort();
}
function resumenMes(key){
  if(!key) return null;
  const vm=eerrVentasPorMes(), gm=eerrGastosPorMes();
  return eerrNamed(calcularEerrMes(vm[key], gm[key]));
}
function cuentaDeFormaPago(fp){ return fp==='Efectivo'?'Efectivo':fp==='Transferencia'?'Transferencia':fp==='E-check'?'Banco':fp==='MP'?'MP':null; }
function ingresosCuenta(c){
  let t=0;
  data.ventasDiarias.forEach(v=>{
    if(c==='Efectivo') t+=v.restauranteEfectivo+v.kioscoEfectivo+v.chiringoEfectivo+v.parrillaEfectivo;
    else if(c==='Banco') t+=v.restauranteBco+v.kioscoBco;
    else if(c==='MP') t+=v.restauranteMp+v.kioscoMp+v.chiringoMp+v.parrillaMp;
  });
  return t;
}
function egresosCuenta(c){
  let e=0;
  data.gastos.forEach(g=>{ if(g.formaPago && cuentaDeFormaPago(g.formaPago)===c) e+=g.total; });
  if(c==='MP') data.ventasDiarias.forEach(v=>{ e+=v.impuestosMp; });
  if(c==='Transferencia') data.ventasDiarias.forEach(v=>{ e+=v.impuestosBco; });
  return e;
}
function saldoCuenta(c){ return (data.saldosIniciales[c]||0) + ingresosCuenta(c) - egresosCuenta(c); }

/* ===== Cálculos (RRHH) ===== */
const EV0 = {horasExtra:0,feriados:0,ausencias:0,plusVacacional:0,adelantos:0};
function totalMesAnteriorEmpleado(empleadoId, mes){
  const previas = data.rrhhLiquidaciones.filter(l=>l.empleadoId===empleadoId && l.mes < mes).sort((a,b)=>a.mes.localeCompare(b.mes));
  if(previas.length) return previas[previas.length-1].totalMes;
  const emp = data.empleados.find(e=>e.id===empleadoId);
  return emp ? emp.sueldoIngreso : 0;
}

/* ===== Cálculos (Costo) ===== */
function getInsumo(id){ return data.insumos.find(i=>i.id===id); }
function getReceta(id){ return data.recetas.find(r=>r.id===id); }
function costoReceta(r){
  if(!r) return 0;
  return r.ingredientes.reduce((s,ing)=>{ const i=getInsumo(ing.insumoId); return i ? s+(ing.cantidad||0)*(i.precioActual||0) : s; },0);
}
function menuComputed(m){
  const receta = m.recetaId ? getReceta(m.recetaId) : null;
  const costo = receta ? costoReceta(receta) : 0, precio = m.precioVenta||0;
  const fc = precio>0 ? costo/precio : null;
  let estado={cls:'', label:'OK'};
  if(precio>0 && costo===0) estado={cls:'late', label:'Sin costo'};
  else if(precio===0 && costo>0) estado={cls:'pend', label:'Sin precio'};
  else if(fc!==null && fc>0.35) estado={cls:'pend', label:'Food cost alto'};
  return {receta, costo, precio, fc, margen:precio-costo, estado};
}

  const cats=[...new Set(data.recetas.map(r=>r.categoria).filter(Boolean))].sort(), cat=ui.f.rCat||'', qy=(ui.f.rQ||'').trim().toLowerCase();
  const rows=data.recetas.filter(r=>(!cat||r.categoria===cat) && (!qy||r.nombre.toLowerCase().includes(qy)));
  let h = card('', `<div class="filt"><div class="f"><label>Categoría</label><select onchange="setF('rCat',this.value)"><option value="">Todas</option>${cats.map(c=>`<option value="${esc(c)}" ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="f" style="flex-basis:100%"><label>Buscar receta</label><input id="rQ" type="search" value="${esc(ui.f.rQ||'')}" placeholder="Buscar…" oninput="setFSearch('rQ',this.value,'rQ')"></div></div>`);
  if(!rows.length) return h+emptyCard('No hay recetas con esos filtros.');
  return h + card('Recetas ('+rows.length+') · tocá para ver ingredientes', rows.slice(0,80).map(r=>{
    const det=r.ingredientes.map(ing=>{ const i=getInsumo(ing.insumoId); return i?`<div class="l s"><span>${esc(i.nombre)} · ${ing.cantidad} ${esc(i.unidad||'')}</span><span>${fmt2(ing.cantidad*i.precioActual)}</span></div>`:''; }).join('');
    return `<details class="dia"><summary><div class="main"><div style="font-weight:700">${esc(r.nombre)}</div><div style="font-size:12px;color:var(--muted)">${esc(r.categoria||'-')} · ${r.ingredientes.length} ingredientes</div></div><div style="font-weight:800">${fmt2(costoReceta(r))}</div><span class="chev">›</span></summary><div class="det">${det||'<div class="l s"><span>Sin ingredientes</span></div>'}</div></details>`;
  }).join('') + (rows.length>80?`<div class="foot" style="margin-top:8px">Mostrando 80 de ${rows.length}. Usá el buscador para acotar.</div>`:''));
}

function t_costo_menu(){

/* ===== Flujo de sesión ===== */
function show(id){ ['loginScreen','pickerScreen','appScreen','lockScreen','bioOffer'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id)); }

async function entrar(session){
  let {data:profile,error} = await supa.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error||!profile){ await new Promise(r=>setTimeout(r,700)); ({data:profile,error}=await supa.from('profiles').select('*').eq('id',session.user.id).maybeSingle()); }
  if(error||!profile){ document.getElementById('loginError').textContent='No se pudo cargar tu perfil. Probá de nuevo.'; document.getElementById('loginError').classList.remove('hidden'); show('loginScreen'); return; }
  currentProfile = profile;
  document.getElementById('btnCambiarLocal').classList.toggle('hidden', !profile.is_admin);
  if(profile.is_admin){
    const {data:ps} = await supa.from('proyectos').select('*').order('nombre');
    proyectos = ps||[];
    const last = localStorage.getItem('movilProyecto');
    const p = proyectos.find(x=>x.id===last);
    if(p){ await abrirProyecto(p); } else if(proyectos.length===1){ await abrirProyecto(proyectos[0]); } else { mostrarPicker(); }
  }else if(profile.proyecto_id){
    const {data:p} = await supa.from('proyectos').select('*').eq('id',profile.proyecto_id).maybeSingle();
    await abrirProyecto(p || {id:profile.proyecto_id,nombre:'Local'});
  }else{
    document.getElementById('pickerTitle').textContent='Esperando asignación';
    document.getElementById('pickerList').innerHTML='<p>Tu usuario todavía no tiene un local asignado. Avisale al administrador.</p>';
    show('pickerScreen');
  }
}
function mostrarPicker(){
  document.getElementById('pickerTitle').textContent='Elegí un local';
  document.getElementById('pickerList').innerHTML = proyectos.map(p=>`<button class="proy" data-id="${esc(p.id)}">${p.logo_url?`<img src="${esc(p.logo_url)}" alt="">`:''}<span>${esc(p.nombre)}</span></button>`).join('') || '<p>No hay locales.</p>';
  document.querySelectorAll('#pickerList .proy').forEach(b=>b.addEventListener('click',()=>{ const p=proyectos.find(x=>x.id===b.dataset.id); if(p) abrirProyecto(p); }));
  show('pickerScreen');
}
async function abrirProyecto(p){
  currentProyecto = {id:p.id, nombre:p.nombre};
  if(currentProfile && currentProfile.is_admin) localStorage.setItem('movilProyecto', p.id);
  resetSecciones();
  show('appScreen'); renderHeader(); bioFootRender();
}
async function salir(){ await supa.auth.signOut(); localStorage.removeItem('movilProyecto'); localStorage.removeItem('movilBio'); resetSecciones(); show('loginScreen'); }

document.getElementById('btnLogin').addEventListener('click', async ()=>{
  const email=document.getElementById('loginEmail').value.trim(), password=document.getElementById('loginPass').value;
  const err=document.getElementById('loginError'); err.classList.add('hidden');
  const {data:res,error}=await supa.auth.signInWithPassword({email,password});
  if(error){ err.textContent='No se pudo iniciar sesión: '+error.message; err.classList.remove('hidden'); return; }
  ofrecerBio(res.session);
});
document.getElementById('loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('btnLogin').click(); });
document.getElementById('btnLogout').addEventListener('click',salir);
document.getElementById('btnPickerLogout').addEventListener('click',salir);
document.getElementById('btnCambiarLocal').addEventListener('click',mostrarPicker);
document.getElementById('btnRefresh').addEventListener('click',()=>cargarSeccion(true));
document.getElementById('btnBack').addEventListener('click',()=>volverInicio(false));
document.querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>abrirSeccion(b.dataset.sec)));
function aplicarTema(){ const h=new Date().getHours(), t=(h>=7&&h<19)?'light':'dark'; if(document.documentElement.dataset.theme!==t){ document.documentElement.dataset.theme=t; const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=t==='dark'?'#0f1115':'#f2f3f6'; if(ui.sec) renderTab(); } }
setInterval(aplicarTema,60000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) aplicarTema(); });

/* ===== Huella / Face ID (bloqueo local del dispositivo) ===== */
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function bioDisponible(){ try{ return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; } }
function bioSay(m){ ['bioMsg','bioOfferMsg'].forEach(i=>{ const e=document.getElementById(i); if(e){ e.textContent=m; if(i==='bioOfferMsg') e.classList.toggle('hidden',!m); } }); }
async function bioActivar(emailArg){
  bioSay('Pidiendo huella… si no aparece nada en unos segundos, tu teléfono no la está ofreciendo.');
  if(!window.PublicKeyCredential){ bioSay('Este navegador no soporta huella/Face ID. Abrí la app desde Chrome.'); return false; }
  if(!(await bioDisponible())){ bioSay('Tu teléfono no tiene configurado el bloqueo biométrico. Activá una huella o un PIN de pantalla en Ajustes > Seguridad y volvé a intentar.'); return false; }
  const email=emailArg||'usuario';
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'Brocoli PMS',id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:email,displayName:email},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},
      timeout:60000}});
    localStorage.setItem('movilBio',b64(cred.rawId)); bioSay('✅ Huella activada'); bioFootRender(); return true;
  }catch(e){ bioSay('No se pudo activar ('+(e.name||'error')+'): '+(e.message||e)); }
  bioFootRender();
}
async function bioVerificar(){
  const id=localStorage.getItem('movilBio'); if(!id) return true;
  try{
    await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,
      allowCredentials:[{type:'public-key',id:unb64(id)}],userVerification:'required',timeout:60000}});
    return true;
  }catch(e){ return false; }
}
async function bioFootRender(){
  const el=document.getElementById('bioFoot');
  if(localStorage.getItem('movilBio')) el.innerHTML='<a href="#" id="bioToggle" style="color:var(--muted)">🔓 Desactivar huella / Face ID</a>';
  else if(true) el.innerHTML='<a href="#" id="bioToggle" style="color:var(--accent);font-weight:600">🔒 Activar huella / Face ID</a>';
  document.getElementById('bioToggle').onclick=async e=>{ e.preventDefault(); if(localStorage.getItem('movilBio')){ localStorage.removeItem('movilBio'); bioFootRender(); } else bioActivar(window.__bioEmail); };
}
async function desbloquear(){
  const err=document.getElementById('lockError'); err.classList.add('hidden');
  if(await bioVerificar()){ const {data:{session}}=await supa.auth.getSession(); if(session) window.__bioEmail=session.user.email;
  if(session && localStorage.getItem('movilBio')){ show('lockScreen'); desbloquear(); } else if(session) entrar(session); else show('loginScreen'); }
  else { err.textContent='No se pudo verificar. Tocá Desbloquear para reintentar.'; err.classList.remove('hidden'); }
}
function bloquear(){ if(localStorage.getItem('movilBio') && !document.getElementById('appScreen').classList.contains('hidden')){ destroyCharts(); show('lockScreen'); } }
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); }
  else if(hiddenAt && Date.now()-hiddenAt>60000){ bloquear(); if(!document.getElementById('lockScreen').classList.contains('hidden')) desbloquear(); }
});
document.getElementById('btnUnlock').addEventListener('click',desbloquear);
document.getElementById('btnLockPass').addEventListener('click',salir);

let pendingSession=null;
async function ofrecerBio(session){
  window.__bioEmail=session.user.email;
  if(!localStorage.getItem('movilBio') && await bioDisponible()){ pendingSession=session; bioSay(''); show('bioOffer'); }
  else entrar(session);
}
document.getElementById('btnBioSi').addEventListener('click',async()=>{
  const ok=await bioActivar(window.__bioEmail);
  if(ok && pendingSession){ const s=pendingSession; pendingSession=null; entrar(s); }
  else document.getElementById('btnBioNo').textContent='Continuar sin huella';
});
document.getElementById('btnBioNo').addEventListener('click',()=>{ if(pendingSession){ const s=pendingSession; pendingSession=null; entrar(s); } });

(async function init(){
  const {data:{session}} = await supa.auth.getSession();
  if(session) entrar(session); else show('loginScreen');
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
