function fmt(n){ if(n===null||n===undefined||isNaN(n)) return '-'; return '$'+Number(n).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtCorto(n){
  const a=Math.abs(n), s=n<0?'-':'';
  if(a>=1e6) return s+'$'+(a/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M';
  if(a>=1e3) return s+'$'+Math.round(a/1e3).toLocaleString('es-AR')+' k';
  return s+'$'+Math.round(a);
}
function fmtPct(n){ if(n===null||n===undefined||isNaN(n)||!isFinite(n)) return '-'; return (n*100).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
function fmtMes(iso){ if(!iso) return '-'; const [y,m]=iso.split('-'); const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return (meses[Number(m)-1]||m)+'-'+y.slice(2); }
function fmtMesLargo(k){ const [y,m]=k.split('-'); const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; return meses[Number(m)-1]+' '+y; }
function fmtDiaMes(iso){ if(!iso) return '-'; const [y,m,d]=iso.split('-'); return d+'/'+m; }
function monthKey(iso){ return iso ? iso.slice(0,7) : null; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function todayIso(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ===== Lógica de EERR (misma que la app principal) ===== */

function eerrVentasPorMes(){
  const map = {};
  data.ventasDiarias.forEach(v=>{
    const k = monthKey(v.fecha); if(!k) return;
    if(!map[k]) map[k] = {ventas:0, viandas:0, terceros:0};
    const restTotal = v.restauranteEfectivo + v.restauranteBco + v.restauranteMp;
    const kioscoTotal = v.kioscoEfectivo + v.kioscoBco + v.kioscoMp;
    const chiringoTotal = (v.chiringoEfectivo||0) + (v.chiringoMp||0);
    const parrillaTotal = v.parrillaEfectivo + v.parrillaMp;
    map[k].ventas += restTotal + kioscoTotal + chiringoTotal + parrillaTotal;
    map[k].viandas += v.viandasTotal;
    map[k].terceros += v.terceirosTotal;
  });
  return map;
}

function eerrGastosPorMes(){
  const map = {};
  data.gastos.forEach(g=>{
    const k = monthKey(g.fechaFc || g.fechaCarga); if(!k) return;
    if(!map[k]) map[k] = {};
    /* Normalizado a mayúsculas para que el gasto sume en su línea de EERR sin importar
       cómo haya quedado tipeada la familia (ej: "Bonos" vs "BONOS"). */
    const fam = (g.familiaNombre || '(sin familia)').trim().toUpperCase();
    map[k][fam] = (map[k][fam]||0) + g.total;
  });
  /* Impuestos MP / Impuestos Bco.: casillas cargadas a mano día a día en Ventas y
     Caja. No suman al Total día de esa tabla, pero sí viajan diariamente a estas
     líneas del EERR. */
  data.ventasDiarias.forEach(v=>{
    const k = monthKey(v.fecha); if(!k) return;
    if(!map[k]) map[k] = {};
    if(v.impuestosMp) map[k]['IMPUESTOS Y COMISIONES MP'] = (map[k]['IMPUESTOS Y COMISIONES MP']||0) + v.impuestosMp;
    if(v.impuestosBco) map[k]['COMISION POSNET'] = (map[k]['COMISION POSNET']||0) + v.impuestosBco;
  });
  return map;
}

/* Calcula, para un mes dado, el valor de cada línea de EERR_STRUCTURE usando una pila
   que acumula automáticamente el valor de las líneas de detalle en todos sus headers
   (h1/h2/h3) abiertos — así los subtotales siempre están bien sumados. */
function calcularEerrMes(ventasMes, famMap){
  const rowVals = new Array(EERR_STRUCTURE.length).fill(null);
  const named = {};
  let stack = [];

  function popTo(level){
    while(stack.length && stack[stack.length-1].level >= level){
      const e = stack.pop();
      rowVals[e.idx] = e.sum;
      if(e.key) named[e.key] = e.sum;
      if(stack.length) stack[stack.length-1].sum += e.sum;
    }
  }

  // Pasada 1: recorre solo las líneas de la jerarquía de costos/gastos (headers h1/h2/h3
  // y líneas de detalle) para calcular costosVariables, costosFijos, gastosFinancieros
  // e impuestos. Se ignoran acá las líneas de resumen (ingresos/egresos/resultado) porque
  // dependen de estos totales y todavía no están calculados.
  EERR_STRUCTURE.forEach((row, i)=>{
    if(row.t==='h1' || row.t==='h2' || row.t==='h3'){
      const level = row.t==='h1'?1:row.t==='h2'?2:3;
      popTo(level);
      stack.push({level, idx:i, key:row.key, sum:0});
    } else if(row.t==='d'){
      const val = (famMap && famMap[row.label.trim().toUpperCase()]) || 0;
      rowVals[i] = val;
      if(stack.length) stack[stack.length-1].sum += val;
    }
  });
  popTo(0);

  // Pasada 2: con costosVariables/costosFijos/gastosFinancieros/impuestos ya resueltos,
  // se calculan en orden las líneas de ventas, ingresos, egresos y resultados.
  EERR_STRUCTURE.forEach((row, i)=>{
    if(row.t==='plain'){
      const val = (ventasMes && ventasMes[row.key]) || 0;
      rowVals[i] = val; named[row.key] = val;
    } else if(row.t==='ingresos'){
      const val = (named.ventas||0) + (named.viandas||0) + (named.terceros||0);
      rowVals[i] = val; named.totalIngresos = val; named[row.key] = val;
    } else if(row.t==='egresos'){
      const val = (named.costosVariables||0) + (named.costosFijos||0) + (named.gastosFinancieros||0) + (named.impuestos||0);
      rowVals[i] = val; named[row.key] = val;
    } else if(row.t==='resultado'){
      let val = 0;
      if(row.key==='margenBruto') val = (named.totalIngresos||0) - (named.costosVariables||0);
      else if(row.key==='resultadoOperativo') val = (named.margenBruto||0) - (named.costosFijos||0);
      else if(row.key==='resultadoAntesImpuestos') val = (named.resultadoOperativo||0) - (named.gastosFinancieros||0);
      else if(row.key==='resultadoNeto1') val = (named.totalIngresos||0) - (named.totalEgresos1||0);
      else if(row.key==='resultadoNeto2') val = (named.totalIngresos||0) - (named.totalEgresos2||0);
      rowVals[i] = val; named[row.key] = val;
    }
  });

  return rowVals;
}



function eerrNamed(rowVals){
  const o={};
  EERR_STRUCTURE.forEach((r,i)=>{ if(r.key) o[r.key]=rowVals[i]||0; });
  return o;
}

/* ===== Carga de datos (solo lectura) ===== */
async function cargarDatos(){
  const pid = currentProyecto.id;
  const [v,g,s] = await Promise.all([
    supa.from('ventas_diarias').select('*').eq('proyecto_id',pid).order('fecha'),
    supa.from('gastos').select('*, proveedores(nombre), familias(nombre)').eq('proyecto_id',pid).order('fecha_fc',{ascending:false}),
    supa.from('egresos_saldos_iniciales').select('*').eq('proyecto_id',pid),
  ]);
  if(v.error) throw v.error; if(g.error) throw g.error;
  data.ventasDiarias = (v.data||[]).map(v=>({
    id:v.id, fecha:v.fecha,
    restauranteEfectivo:Number(v.restaurante_efectivo)||0, restauranteBco:Number(v.restaurante_bco)||0, restauranteMp:Number(v.restaurante_mp)||0,
    kioscoEfectivo:Number(v.kiosco_efectivo)||0, kioscoBco:Number(v.kiosco_bco)||0, kioscoMp:Number(v.kiosco_mp)||0,
    chiringoEfectivo:Number(v.chiringo_efectivo)||0, chiringoMp:Number(v.chiringo_mp)||0,
    viandasTotal:Number(v.viandas_total)||0, terceirosTotal:Number(v.terceros_total)||0,
    parrillaEfectivo:Number(v.parrilla_efectivo)||0, parrillaMp:Number(v.parrilla_mp)||0,
    total:Number(v.total)||0, impuestosMp:Number(v.impuestos_mp)||0, impuestosBco:Number(v.impuestos_bco)||0,
  }));
  data.gastos = (g.data||[]).map(x=>({
    id:x.id, fechaFc:x.fecha_fc, fechaCarga:x.fecha_carga, fechaPago:x.fecha_pago, formaPago:x.forma_pago, formaPagoFecha:x.forma_pago_fecha,
    proveedorNombre:(x.proveedores&&x.proveedores.nombre)?x.proveedores.nombre:'Sin proveedor',
    familiaNombre:(x.familias&&x.familias.nombre)?x.familias.nombre:'-',
    total:Number(x.total)||0,
  }));
  data.saldosIniciales = {};
  (s.data||[]).forEach(e=>{ data.saldosIniciales[e.cuenta]=Number(e.saldo)||0; });
}

/* ===== Cálculos del resumen ===== */
function mesesDisponibles(){
  const vm = eerrVentasPorMes(), gm = eerrGastosPorMes();
  return [...new Set([...Object.keys(vm),...Object.keys(gm)])].sort();
}
function resumenMes(key){
  if(!key) return null;
  const vm=eerrVentasPorMes(), gm=eerrGastosPorMes();
  return eerrNamed(calcularEerrMes(vm[key], gm[key]));
}
function cuentaDeFormaPago(fp){ return fp==='Efectivo'?'Efectivo':fp==='Transferencia'?'Transferencia':fp==='E-check'?'Banco':fp==='MP'?'MP':null; }
function ingresosCuenta(c){
  let t=0;
  data.ventasDiarias.forEach(v=>{
    if(c==='Efectivo') t+=v.restauranteEfectivo+v.kioscoEfectivo+v.chiringoEfectivo+v.parrillaEfectivo;
    else if(c==='Banco') t+=v.restauranteBco+v.kioscoBco;
    else if(c==='MP') t+=v.restauranteMp+v.kioscoMp+v.chiringoMp+v.parrillaMp;
  });
  return t;
}
function saldoCuenta(c){
  let egresos=0;
  data.gastos.forEach(g=>{ if(g.formaPago && cuentaDeFormaPago(g.formaPago)===c) egresos+=g.total; });
  if(c==='MP') data.ventasDiarias.forEach(v=>{ egresos+=v.impuestosMp; });
  if(c==='Transferencia') data.ventasDiarias.forEach(v=>{ egresos+=v.impuestosBco; });
  return (data.saldosIniciales[c]||0) + ingresosCuenta(c) - egresos;
}

/* ===== Render ===== */
function destroyCharts(){ Object.keys(charts).forEach(k=>{ charts[k].destroy(); delete charts[k]; }); }
const PALETA = ['#4f8cff','#2ecc71','#f1c40f','#e67e22','#b388e0','#e74c3c','#1abc9c','#95a5a6'];

function delta(actual, anterior){
  if(anterior===null||anterior===undefined||!anterior) return '';
  const d=(actual-anterior)/Math.abs(anterior);
  const cls = d>=0 ? 'pos':'neg';
  return `<span class="${cls}">${d>=0?'▲':'▼'} ${fmtPct(Math.abs(d))}</span> vs mes anterior`;
}

function render(){
  destroyCharts();
  const meses = mesesDisponibles();
  const sel = document.getElementById('mesSelect');
  if(!meses.length){ sel.innerHTML=''; document.getElementById('content').innerHTML='<div class="card"><div class="empty">Todavía no hay datos cargados.</div></div>'; return; }
  if(!mesSel || !meses.includes(mesSel)){
    const cur = todayIso().slice(0,7);
    mesSel = meses.includes(cur) ? cur : meses[meses.length-1];
  }
  sel.innerHTML = meses.slice().reverse().map(k=>`<option value="${k}" ${k===mesSel?'selected':''}>${fmtMesLargo(k)}</option>`).join('');

  const idx = meses.indexOf(mesSel);
  const prevKey = idx>0 ? meses[idx-1] : null;
  const R = resumenMes(mesSel), P = resumenMes(prevKey);

  let h='';
  /* 1) Totales */
  h+=`<section class="card"><h2>Totales · ${fmtMesLargo(mesSel)}</h2><div class="kpis">
    <div class="kpi"><div class="l">Ventas</div><div class="n pos">${fmt(R.totalIngresos)}</div><div class="d">${delta(R.totalIngresos,P&&P.totalIngresos)}</div></div>
    <div class="kpi"><div class="l">Egresos</div><div class="n neg">${fmt(R.totalEgresos1)}</div><div class="d">${delta(R.totalEgresos1,P&&P.totalEgresos1)}</div></div>
    <div class="kpi wide"><div class="l">Resultado neto</div><div class="n ${R.resultadoNeto1<0?'neg':'pos'}">${fmt(R.resultadoNeto1)}</div><div class="d">${delta(R.resultadoNeto1,P&&P.resultadoNeto1)}${R.totalIngresos?` · margen ${fmtPct(R.resultadoNeto1/R.totalIngresos)}`:''}</div></div>
  </div></section>`;

  /* 2) Ventas diarias */
  h+=`<section class="card"><h2>Ventas diarias</h2><div class="chartbox"><canvas id="chVentas"></canvas></div><div class="foot" id="ventasFoot"></div></section>`;
  /* 3) Ventas vs egresos 6 meses */
  h+=`<section class="card"><h2>Ventas vs egresos · últimos meses</h2><div class="chartbox"><canvas id="chMeses"></canvas></div></section>`;
  /* 4) Egresos por familia */
  h+=`<section class="card"><h2>Egresos por familia</h2><div class="chartbox"><canvas id="chFam"></canvas></div><div class="legend" id="famLegend"></div></section>`;
  /* 5) Próximos pagos */
  h+=`<section class="card"><h2>Próximos pagos</h2><div class="list" id="pagosList"></div></section>`;
  /* 6) Saldos de caja */
  h+=`<section class="card"><h2>Saldos de caja</h2><div class="kpis" id="cajaKpis"></div></section>`;
  /* 7) EERR resumido */
  const filasEerr=[
    ['Total ingresos','totalIngresos',1],['Costos variables','costosVariables'],['Margen bruto','margenBruto',1],
    ['Costos fijos','costosFijos'],['Resultado operativo','resultadoOperativo',1],['Gastos financieros','gastosFinancieros'],
    ['Resultado antes de impuestos','resultadoAntesImpuestos',1],['Impuestos','impuestos'],['Resultado neto','resultadoNeto1',1],
  ];
  h+=`<section class="card"><h2>EERR resumido · ${fmtMes(mesSel+'-01')}</h2><table class="tbl">${
    filasEerr.map(([l,k,b])=>`<tr class="${b?'b':''}"><td>${l}</td><td class="r ${(k.startsWith('resultado')||k==='margenBruto')?(R[k]<0?'neg':''):''}">${fmt(R[k])}</td><td class="p">${R.totalIngresos?fmtPct(R[k]/R.totalIngresos):'-'}</td></tr>`).join('')
  }</table></section>`;
  h+=`<div class="foot">Solo lectura · datos de ${esc(currentProyecto.nombre)}</div>`;
  document.getElementById('content').innerHTML=h;

  const txt=css('--text'), mut=css('--muted'), grid=css('--border');
  Chart.defaults.color = mut; Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;

  /* Ventas diarias */
  const dias = data.ventasDiarias.filter(v=>monthKey(v.fecha)===mesSel).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(dias.length){
    charts.ventas = new Chart(document.getElementById('chVentas'),{
      type:'bar',
      data:{labels:dias.map(v=>Number(v.fecha.slice(8))), datasets:[{data:dias.map(v=>v.total), backgroundColor:css('--accent'), borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>'Día '+i[0].label,label:i=>fmt(i.parsed.y)}}},
        scales:{y:{ticks:{callback:v=>fmtCorto(v),maxTicksLimit:5},grid:{color:grid}},x:{grid:{display:false}}}}
    });
    const tot=dias.reduce((s,v)=>s+v.total,0);
    const mejor=dias.reduce((a,b)=>b.total>a.total?b:a);
    document.getElementById('ventasFoot').textContent=`Promedio ${fmt(tot/dias.length)} por día · mejor día ${fmtDiaMes(mejor.fecha)} (${fmt(mejor.total)})`;
  }else{
    document.getElementById('chVentas').parentElement.innerHTML='<div class="empty">Sin ventas cargadas en este mes.</div>';
  }

  /* Ventas vs egresos */
  const hasta = meses.slice(Math.max(0,idx-5), idx+1);
  const res = hasta.map(resumenMes);
  charts.meses = new Chart(document.getElementById('chMeses'),{
    type:'bar',
    data:{labels:hasta.map(k=>fmtMes(k+'-01')), datasets:[
      {label:'Ventas',data:res.map(r=>r.totalIngresos),backgroundColor:css('--green'),borderRadius:4},
      {label:'Egresos',data:res.map(r=>r.totalEgresos1),backgroundColor:css('--red'),borderRadius:4},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10}},tooltip:{callbacks:{label:i=>i.dataset.label+': '+fmt(i.parsed.y)}}},
      scales:{y:{ticks:{callback:v=>fmtCorto(v),maxTicksLimit:5},grid:{color:grid}},x:{grid:{display:false}}}}
  });

  /* Torta de egresos por familia */
  const fm = eerrGastosPorMes()[mesSel] || {};
  let fams = Object.entries(fm).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const totalFam = fams.reduce((s,[,v])=>s+v,0);
  if(fams.length>7){ const resto=fams.slice(7).reduce((s,[,v])=>s+v,0); fams=fams.slice(0,7).concat([['Otros',resto]]); }
  if(fams.length){
    charts.fam = new Chart(document.getElementById('chFam'),{
      type:'doughnut',
      data:{labels:fams.map(f=>f[0]),datasets:[{data:fams.map(f=>f[1]),backgroundColor:fams.map((_,i)=>PALETA[i%PALETA.length]),borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>i.label+': '+fmt(i.parsed)}}}}
    });
    document.getElementById('famLegend').innerHTML = fams.map((f,i)=>`<div class="row"><span class="dot" style="background:${PALETA[i%PALETA.length]}"></span><span class="nm">${esc(f[0])}</span><span class="vl">${fmt(f[1])}</span><span class="pc">${fmtPct(f[1]/totalFam)}</span></div>`).join('');
  }else{
    document.getElementById('chFam').parentElement.innerHTML='<div class="empty">Sin egresos cargados en este mes.</div>';
  }

  /* Próximos pagos: gastos con fecha de pago y todavía sin forma de pago */
  const hoy = todayIso();
  const pend = data.gastos.filter(g=>g.fechaPago && !g.formaPago).sort((a,b)=>a.fechaPago.localeCompare(b.fechaPago));
  const vencidos = pend.filter(g=>g.fechaPago<hoy);
  const proximos = pend.filter(g=>g.fechaPago>=hoy).slice(0,10);
  const itemHtml=(g,late)=>`<div class="item"><span class="when ${late?'neg':''}">${fmtDiaMes(g.fechaPago)}</span><span class="who">${esc(g.proveedorNombre)}</span>${late?'<span class="badge late">vencido</span>':''}<span class="amt">${fmt(g.total)}</span></div>`;
  let ph='';
  if(vencidos.length){
    const totV=vencidos.reduce((s,g)=>s+g.total,0);
    ph+=`<div class="empty"><b class="neg">${vencidos.length} vencido${vencidos.length>1?'s':''}</b> sin pagar · ${fmt(totV)}</div>`+vencidos.slice(-5).map(g=>itemHtml(g,true)).join('');
  }
  ph+=proximos.map(g=>itemHtml(g,false)).join('');
  if(!ph) ph='<div class="empty">No hay pagos pendientes con fecha de pago.</div>';
  document.getElementById('pagosList').innerHTML=ph;

  /* Saldos de caja */
  const cuentas=[['Efectivo','Efectivo'],['Transferencia','Transferencia'],['Banco','Banco (E-check)'],['MP','Mercado Pago']];
  let tot=0;
  const kp = cuentas.map(([k,l])=>{ const s=saldoCuenta(k); tot+=s; return `<div class="kpi"><div class="l">${l}</div><div class="n ${s<0?'neg':''}">${fmt(s)}</div></div>`; }).join('');
  document.getElementById('cajaKpis').innerHTML = kp + `<div class="kpi wide"><div class="l">Total</div><div class="n ${tot<0?'neg':'pos'}">${fmt(tot)}</div></div>`;
}

/* ===== Flujo de sesión ===== */
function show(id){ ['loginScreen','pickerScreen','appScreen','lockScreen','bioOffer'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id)); }

async function entrar(session){
  let {data:profile,error} = await supa.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error||!profile){ await new Promise(r=>setTimeout(r,700)); ({data:profile,error}=await supa.from('profiles').select('*').eq('id',session.user.id).maybeSingle()); }
  if(error||!profile){ document.getElementById('loginError').textContent='No se pudo cargar tu perfil. Probá de nuevo.'; document.getElementById('loginError').classList.remove('hidden'); show('loginScreen'); return; }
  currentProfile = profile;
  document.getElementById('btnCambiarLocal').classList.toggle('hidden', !profile.is_admin);
  if(profile.is_admin){
    const {data:ps} = await supa.from('proyectos').select('*').order('nombre');
    proyectos = ps||[];
    const last = localStorage.getItem('movilProyecto');
    const p = proyectos.find(x=>x.id===last);
    if(p){ await abrirProyecto(p); } else if(proyectos.length===1){ await abrirProyecto(proyectos[0]); } else { mostrarPicker(); }
  }else if(profile.proyecto_id){
    const {data:p} = await supa.from('proyectos').select('*').eq('id',profile.proyecto_id).maybeSingle();
    await abrirProyecto(p || {id:profile.proyecto_id,nombre:'Local'});
  }else{
    document.getElementById('pickerTitle').textContent='Esperando asignación';
    document.getElementById('pickerList').innerHTML='<p>Tu usuario todavía no tiene un local asignado. Avisale al administrador.</p>';
    show('pickerScreen');
  }
}
function mostrarPicker(){
  document.getElementById('pickerTitle').textContent='Elegí un local';
  document.getElementById('pickerList').innerHTML = proyectos.map(p=>`<button class="proy" data-id="${esc(p.id)}">${p.logo_url?`<img src="${esc(p.logo_url)}" alt="">`:''}<span>${esc(p.nombre)}</span></button>`).join('') || '<p>No hay locales.</p>';
  document.querySelectorAll('#pickerList .proy').forEach(b=>b.addEventListener('click',()=>{ const p=proyectos.find(x=>x.id===b.dataset.id); if(p) abrirProyecto(p); }));
  show('pickerScreen');
}
async function abrirProyecto(p){
  currentProyecto = {id:p.id, nombre:p.nombre};
  if(currentProfile && currentProfile.is_admin) localStorage.setItem('movilProyecto', p.id);
  document.getElementById('localName').textContent = p.nombre;
  mesSel = null;
  show('appScreen'); bioFootRender();
  document.getElementById('content').innerHTML='<div class="loading">Cargando…</div>';
  await refrescar();
}
async function refrescar(){
  try{ await cargarDatos(); render(); }
  catch(e){ document.getElementById('content').innerHTML='<div class="card"><div class="err">No se pudieron cargar los datos: '+esc(e.message)+'</div></div>'; }
}
async function salir(){ await supa.auth.signOut(); localStorage.removeItem('movilProyecto'); localStorage.removeItem('movilBio'); destroyCharts(); show('loginScreen'); }

document.getElementById('btnLogin').addEventListener('click', async ()=>{
  const email=document.getElementById('loginEmail').value.trim(), password=document.getElementById('loginPass').value;
  const err=document.getElementById('loginError'); err.classList.add('hidden');
  const {data:res,error}=await supa.auth.signInWithPassword({email,password});
  if(error){ err.textContent='No se pudo iniciar sesión: '+error.message; err.classList.remove('hidden'); return; }
  ofrecerBio(res.session);
});
document.getElementById('loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('btnLogin').click(); });
document.getElementById('btnLogout').addEventListener('click',salir);
document.getElementById('btnPickerLogout').addEventListener('click',salir);
document.getElementById('btnCambiarLocal').addEventListener('click',mostrarPicker);
document.getElementById('btnRefresh').addEventListener('click',refrescar);
document.getElementById('mesSelect').addEventListener('change',e=>{ mesSel=e.target.value; render(); });
function aplicarTema(){ const h=new Date().getHours(), t=(h>=7&&h<19)?'light':'dark'; if(document.documentElement.dataset.theme!==t){ document.documentElement.dataset.theme=t; const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=t==='dark'?'#0f1115':'#f2f3f6'; if(!document.getElementById('appScreen').classList.contains('hidden')) render(); } }
setInterval(aplicarTema,60000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) aplicarTema(); });

/* ===== Huella / Face ID (bloqueo local del dispositivo) ===== */
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function bioDisponible(){ try{ return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; } }
function bioSay(m){ ['bioMsg','bioOfferMsg'].forEach(i=>{ const e=document.getElementById(i); if(e){ e.textContent=m; if(i==='bioOfferMsg') e.classList.toggle('hidden',!m); } }); }
async function bioActivar(emailArg){
  bioSay('Pidiendo huella… si no aparece nada en unos segundos, tu teléfono no la está ofreciendo.');
  if(!window.PublicKeyCredential){ bioSay('Este navegador no soporta huella/Face ID. Abrí la app desde Chrome.'); return false; }
  if(!(await bioDisponible())){ bioSay('Tu teléfono no tiene configurado el bloqueo biométrico. Activá una huella o un PIN de pantalla en Ajustes > Seguridad y volvé a intentar.'); return false; }
  const email=emailArg||'usuario';
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'Brocoli PMS',id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:email,displayName:email},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},
      timeout:60000}});
    localStorage.setItem('movilBio',b64(cred.rawId)); bioSay('✅ Huella activada'); bioFootRender(); return true;
  }catch(e){ bioSay('No se pudo activar ('+(e.name||'error')+'): '+(e.message||e)); }
  bioFootRender(); return false;
}
async function bioVerificar(){
  const id=localStorage.getItem('movilBio'); if(!id) return true;
  try{
    await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,
      allowCredentials:[{type:'public-key',id:unb64(id)}],userVerification:'required',timeout:60000}});
    return true;
  }catch(e){ return false; }
}
async function bioFootRender(){
  const el=document.getElementById('bioFoot');
  if(localStorage.getItem('movilBio')) el.innerHTML='<a href="#" id="bioToggle" style="color:var(--muted)">🔓 Desactivar huella / Face ID</a>';
  else if(true) el.innerHTML='<a href="#" id="bioToggle" style="color:var(--accent);font-weight:600">🔒 Activar huella / Face ID</a>';
  document.getElementById('bioToggle').onclick=async e=>{ e.preventDefault(); if(localStorage.getItem('movilBio')){ localStorage.removeItem('movilBio'); bioFootRender(); } else bioActivar(window.__bioEmail); };
}
async function desbloquear(){
  const err=document.getElementById('lockError'); err.classList.add('hidden');
  if(await bioVerificar()){ const {data:{session}}=await supa.auth.getSession(); if(session) window.__bioEmail=session.user.email;
  if(session && localStorage.getItem('movilBio')){ show('lockScreen'); desbloquear(); } else if(session) entrar(session); else show('loginScreen'); }
  else { err.textContent='No se pudo verificar. Tocá Desbloquear para reintentar.'; err.classList.remove('hidden'); }
}
function bloquear(){ if(localStorage.getItem('movilBio') && !document.getElementById('appScreen').classList.contains('hidden')){ destroyCharts(); show('lockScreen'); } }
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); }
  else if(hiddenAt && Date.now()-hiddenAt>60000){ bloquear(); if(!document.getElementById('lockScreen').classList.contains('hidden')) desbloquear(); }
});
document.getElementById('btnUnlock').addEventListener('click',desbloquear);
document.getElementById('btnLockPass').addEventListener('click',salir);

let pendingSession=null;
async function ofrecerBio(session){
  window.__bioEmail=session.user.email;
  if(!localStorage.getItem('movilBio') && await bioDisponible()){ pendingSession=session; bioSay(''); show('bioOffer'); }
  else entrar(session);
}
document.getElementById('btnBioSi').addEventListener('click',async()=>{
  const ok=await bioActivar(window.__bioEmail);
  if(ok && pendingSession){ const s=pendingSession; pendingSession=null; entrar(s); }
  else document.getElementById('btnBioNo').textContent='Continuar sin huella';
});
document.getElementById('btnBioNo').addEventListener('click',()=>{ if(pendingSession){ const s=pendingSession; pendingSession=null; entrar(s); } });

(async function init(){
  const {data:{session}} = await supa.auth.getSession();
  if(session) entrar(session); else show('loginScreen');
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
