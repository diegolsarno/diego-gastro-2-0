name: Recordatorio de pagos

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  enviar-recordatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install @supabase/supabase-js@2 nodemailer@6
      - run: node scripts/recordatorio-pagos.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_USER: ${{ secrets.BREVO_USER }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
