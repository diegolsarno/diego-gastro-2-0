name: Recordatorio de pagos

on:
  schedule:
    # Cada 30 min entre las 7:40 y las 11:40 (Argentina). La primera espera hasta las 8:00 para enviar.
    # Las demas son reintentos: si ya hubo una ejecucion exitosa hoy no hacen nada.
    - cron: '40 10 * * *'
    - cron: '10 11 * * *'
    - cron: '40 11 * * *'
    - cron: '10 12 * * *'
    - cron: '40 12 * * *'
    - cron: '10 13 * * *'
    - cron: '40 13 * * *'
    - cron: '10 14 * * *'
    - cron: '40 14 * * *'
  workflow_dispatch: {}

concurrency:
  group: recordatorio-pagos
  cancel-in-progress: false

jobs:
  enviar-recordatorio:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Ver si ya se envio hoy
        id: ya
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOY=$(date -u +%F)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/recordatorio-pagos.yml/runs?created=$HOY&status=success&event=schedule" --jq '.total_count')
          echo "Ejecuciones exitosas hoy: $N"
          echo "ya=$N" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.ya.outputs.ya == '' || steps.ya.outputs.ya == '0'
      - uses: actions/setup-node@v4
        if: steps.ya.outputs.ya == '' || steps.ya.outputs.ya == '0'
        with:
          node-version: '22'
      - run: npm install @supabase/supabase-js@2 nodemailer@6
        if: steps.ya.outputs.ya == '' || steps.ya.outputs.ya == '0'
      - run: node scripts/recordatorio-pagos.mjs
        if: steps.ya.outputs.ya == '' || steps.ya.outputs.ya == '0'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
